name: Supabase keepalive

on:
  schedule:
    - cron: '0 9 */3 * *'   # every 3 days at 09:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase edge function
        run: curl -fsS "https://xhvunpdtaucxmgxvfxou.supabase.co/functions/v1/subscribe?ping=1"
